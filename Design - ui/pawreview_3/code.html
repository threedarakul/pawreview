<h1 class="font-headline-md text-headline-md text-on-surface tracking-tight flex items-center gap-space-xs">

<p class="font-body-sm text-body-sm text-on-surface-variant mt-space-xs max-w-xs">

      </p>

<span class="material-symbols-outlined absolute left-space-md text-outline" style="font-size: 18px;">
              mail
            </span>

</div>
</div>

<button aria-label="Toggle password visibility" class="absolute right-space-md text-outline hover:text-on-surface transition-colors focus:outline-none flex items-center" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined" id="eyeIcon" style="font-size: 18px;">
                visibility
              </span>
</button>
</div>
</div>

<label class="flex items-center gap-space-xs cursor-pointer select-none">

<span class="font-body-sm text-body-sm text-on-surface-variant">จำฉันไว้ในระบบ</span>
</label>

<span class="material-symbols-outlined text-body-sm" style="font-size: 14px;">pets</span>
</div>
</div>

<script>
  function togglePasswordVisibility() {
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');
    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      eyeIcon.textContent = 'visibility_off';
    } else {
      passwordInput.type = 'password';
      eyeIcon.textContent = 'visibility';
    }
  }

  function fillDemoAccount() {
    const emailInput = document.getElementById('email');
    const passInput = document.getElementById('password');
    emailInput.value = 'admin@pawreview.co';
    passInput.value = 'pass1234';
    passInput.type = 'text';
    document.getElementById('eyeIcon').textContent = 'visibility_off';
  }

  function handleLogin() {
    const btn = document.getElementById('submitBtn');
    btn.innerHTML = '<span class="material-symbols-outlined animate-spin" style="font-size: 20px;">progress_activity</span> กำลังเข้าสู่ระบบ...';
    btn.disabled = true;
    setTimeout(() => {
      btn.innerHTML = 'สำเร็จแล้ว! 🐾';
      setTimeout(() => {
        btn.innerHTML = '<span>เข้าสู่ระบบ</span><span class="text-title-md">🐾</span>';
        btn.disabled = false;
      }, 1500);
    }, 1000);
  }
